name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Emby.CrossLibraryCollections.csproj

    - name: Build Plugin
      run: dotnet build Emby.CrossLibraryCollections.csproj --configuration Release --no-restore -o ./dist

    - name: Zip Artifact
      run: |
        cd ./dist
        zip -r ../Emby.CrossLibraryCollections.zip Emby.CrossLibraryCollections.dll

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./dist/Emby.CrossLibraryCollections.dll
          Emby.CrossLibraryCollections.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
