name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true
        cache-dependency-path: 'Emby.CrossLibraryCollections.csproj'

    - name: Restore Dependencies
      run: dotnet restore Emby.CrossLibraryCollections.csproj

    - name: Build Plugin (Release)
      run: dotnet build Emby.CrossLibraryCollections.csproj --configuration Release --no-restore
